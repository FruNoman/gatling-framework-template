# The environments a run can target: -Denv=<block> (default local). Secrets only as ${?ENV_NAME} — set in the pod, or locally in
# .env/local.env (see .env.example); a missing one fails the run with its path. Any value can be overridden with
# -D<env>.<path>=… (Typesafe Config), e.g. -Dlocal.mock-server.failure-percent=50.

local {
  # The example service of this template, started in the simulation's before() — delete with the mock/ package once the real
  # service is wired (ONBOARD).
  mock-server {
    enabled = true
    port = 8089
    # share of tool calls the mock answers with a tool error — to see the FailureGuard and the assertions turn red
    failure-percent = 0
    # the mock's token lifetime: short, so a one-minute run shows a renewal
    token-lifetime-seconds = 30
  }
  service {
    base-url = "http://localhost:8089"
    mcp-path = "/mcp"
    token-url = "http://localhost:8089/oauth/token"
    client-id = "load-tests"
    # the mock's own value, not a secret
    client-secret = "local-mock-secret"
  }
  data-source {
    url = "http://localhost:8089/api/companies"
  }
  # The gRPC example (grpcdemo/): its target and the mock that answers it. ONBOARD: delete with grpcdemo/ if no service speaks gRPC.
  grpc-demo {
    target = "localhost:8090"
    plaintext = true
    # every call's deadline — a hung call ends as a KO, not as a user that never finishes
    deadline-ms = 2000
    mock {
      enabled = true
      port = 8090
      latency-ms = 50
      # share of calls the mock answers UNAVAILABLE — to see the run turn red
      failure-percent = 0
    }
  }
  # Live metrics (LiveMetrics): a Graphite listener in front of the dashboard — off without a host. To watch a local run on a
  # cluster's board: a port-forward to its listener and GRAPHITE_HOST=localhost.
  graphite {
    host = ${?GRAPHITE_HOST}
    port = 2003
  }
}

# ONBOARD: one block per environment of the service under test.
dev {
  mock-server.enabled = false
  service {
    base-url = "https://service.dev.example.com"
    mcp-path = "/mcp"
    token-url = "https://auth.dev.example.com/oauth/token"
    client-id = ${?SERVICE_CLIENT_ID}
    client-secret = ${?SERVICE_CLIENT_SECRET}
  }
  data-source {
    url = "https://data.dev.example.com/api/companies"
    username = ${?DATA_SOURCE_USERNAME}
    password = ${?DATA_SOURCE_PASSWORD}
  }
  grpc-demo {
    target = "company-search.dev.example.com:443"
    plaintext = false
    deadline-ms = 2000
    mock { enabled = false, port = 0, latency-ms = 0, failure-percent = 0 }
  }
  # ONBOARD: the Graphite listener the dashboard reads (an old framework's gatling.conf names it, e.g. a telegraf on port 2003)
  graphite {
    host = ${?GRAPHITE_HOST}
    port = 2003
  }
}
